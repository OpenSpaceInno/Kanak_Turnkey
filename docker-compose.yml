services:
  # =========================================================================
  # Frontend: React + Vite SPA served via Nginx with /api Reverse Proxy
  # =========================================================================
  frontend:
    build:
      context: .
      dockerfile: artifacts/kanak-turnkey/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kanak_network

  # =========================================================================
  # Backend: Express 5 API Server (Drizzle ORM -> MySQL + CORS + HTTPS)
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      # Connects directly to MySQL container `db` (password: root)
      MYSQL_URL: "${MYSQL_URL:-mysql://root:root@db:3306/kanak_turnkey}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kanak_network

  # =========================================================================
  # MySQL Database (34 Turnkey Tables, Auto-Initialized & Seeded)
  # =========================================================================
  db:
    build:
      context: .
      dockerfile: lib/db/Dockerfile.mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-kanak_turnkey}"
      MYSQL_USER: "${MYSQL_USER:-kanak}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-root}"
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kanak_network

  # =========================================================================
  # phpMyAdmin (Web UI for MySQL Management & Database Inspection)
  # =========================================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      PMA_ABSOLUTE_URI: "${PMA_ABSOLUTE_URI:-}"
      UPLOAD_LIMIT: 64M
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kanak_network

volumes:
  mysql_data:
    driver: local

networks:
  kanak_network:
    driver: bridge
